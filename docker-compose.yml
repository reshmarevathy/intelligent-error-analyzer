services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
  backend:
    build: ./backend
    restart: unless-stopped
    environment: ["MONGO_URL=mongodb://mongodb:27017","MONGO_DB=error_analyzer"]
    ports: ["8000:8000"]
    depends_on: [mongodb]
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["5173:80"]
    depends_on: [backend]
  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["9090:9090"]
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    depends_on: [backend]
  grafana:
    image: grafana/grafana:12.1.1
    ports: ["3000:3000"]
    volumes: ["grafana_data:/var/lib/grafana","./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro"]
    depends_on: [prometheus]
volumes:
  mongo_data:
  grafana_data:
